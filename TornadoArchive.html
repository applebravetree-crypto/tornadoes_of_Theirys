	const heightmap_layer = L.layerGroup();
	const map_image = L.imageOverlay("Theirys_States_Mercator.png", [[-90, -180],[90, 180]])
	const tileLayer = L.tileLayer('MapTiles/{z}_{x}_{y}.png')
	const map = L.map('map', {
		minZoom: 2,
		maxZoom: 12,
    	zoomSnap: 0.5,
		zoomDelta: 0.5,
		wheelPxPerZoomLevel: 90,
		layers: [map_image]
	}).setView([0, 0], 2);

	const heightmap = L.imageOverlay("Theirys_Heightmap_Mercator.png", [[-90, -180],[90, 180]]).addTo(heightmap_layer)

    const baseLayers = {
    };
    const overlays = {
        "Heightmap": heightmap
    };

    const layerControl = L.control.layers(baseLayers, overlays).addTo(map);

	L.control.scale().addTo(map);
